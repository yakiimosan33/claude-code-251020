<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Music AI Kit</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3v18M9 6l3-3 3 3M9 18l3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1 class="logo-text">Music AI Kit</h1>
            </div>

            <h2 class="login-title">ログイン</h2>
            <p class="login-subtitle">パスワードを入力してアクセスしてください</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password" class="form-label">パスワード</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="パスワードを入力"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;">
                    パスワードが正しくありません
                </div>

                <button type="submit" class="login-button">
                    ログイン
                </button>
            </form>

            <div class="security-notice">
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>このサイトは保護されています</span>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - AIスタジオキッド</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <!-- ヘッダー -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3v18M15 6l-3-3-3 3M15 18l-3 3-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                </svg>
                <span class="logo-text">AIスタジオキッド</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">AI Team</a>
                <a href="#" class="nav-link">AI Apps</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-logo">
                <svg class="hero-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3v18M15 6l-3-3-3 3M15 18l-3 3-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                </svg>
                <h1 class="hero-title">AIスタジオキッド</h1>
            </div>
            <div class="waveform">
                <svg class="wave-svg" viewBox="0 0 800 200" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.6" />
                            <stop offset="50%" style="stop-color:#f093fb;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0.6" />
                        </linearGradient>
                    </defs>
                    <path d="M0,100 L50,80 L100,120 L150,60 L200,140 L250,90 L300,110 L350,70 L400,130 L450,85 L500,115 L550,75 L600,125 L650,95 L700,105 L750,100 L800,100"
                          stroke="url(#waveGradient)" stroke-width="3" fill="none" opacity="0.8"/>
                    <path d="M0,100 L50,90 L100,110 L150,85 L200,115 L250,95 L300,105 L350,92 L400,108 L450,97 L500,103 L550,98 L600,102 L650,99 L700,101 L750,100 L800,100"
                          stroke="url(#waveGradient)" stroke-width="2" fill="none" opacity="0.5"/>
                </svg>
            </div>
        </div>
    </section>

    <!-- ログインフォーム -->
    <div class="login-container">
        <div class="login-box">
            <h2 class="login-title">ログイン</h2>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password" class="form-label">パスワード</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder=""
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;">
                    パスワードが正しくありません
                </div>

                <button type="submit" class="login-button">
                    ログイン
                </button>

                <div class="register-link">
                    <a href="#">新規登録はこちら</a>
                </div>
            </form>
        </div>
    </div>

    <!-- フッター -->
    <footer class="footer">
        <div class="footer-content">
            <p class="copyright">© 2022 MusiC. All rights reserved.</p>
            <div class="social-links">
                <a href="#" class="social-link" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </a>
                <a href="#" class="social-link" aria-label="Twitter">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                    </svg>
                </a>
                <a href="#" class="social-link" aria-label="YouTube">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>
</html>

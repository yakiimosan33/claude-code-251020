<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIスタジオキッド</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="4" width="6" height="6" fill="currentColor"/>
                        <rect x="4" y="14" width="6" height="6" fill="currentColor"/>
                        <rect x="14" y="4" width="6" height="6" fill="currentColor"/>
                        <rect x="14" y="14" width="6" height="6" fill="currentColor"/>
                    </svg>
                    <span class="logo-text">AIスタジオキッド</span>
                </div>
                <ul class="nav-menu">
                    <li><a href="#" class="nav-link active">Home</a></li>
                    <li><a href="#ai-team" class="nav-link">AI Team</a></li>
                    <li><a href="#ai-apps" class="nav-link">AI Apps</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                    <li><button id="logoutBtn" class="logout-button" onclick="MusicAIAuth.logout()">ログアウト</button></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">AIスタジオキッド</h1>
                <div class="hero-visual">
                    <div class="waveform">
                        <!-- プレースホルダー：音声波形ビジュアル -->
                        <div class="wave-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                        <div class="glow-effect"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- スタジオセクション -->
    <section class="studios">
        <div class="container">
            <div class="studios-grid">
                <!-- AI音楽アーティスト制作スタジオカード -->
                <div class="studio-card">
                    <div class="studio-illustration">
                        <!-- 音楽制作のイラストレーション -->
                        <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 背景グラデーション -->
                            <rect width="400" height="300" fill="#F0F4FF"/>

                            <!-- キーボード -->
                            <rect x="80" y="180" width="150" height="80" rx="8" fill="#2C3E50"/>
                            <rect x="90" y="190" width="30" height="60" rx="4" fill="#ECF0F1"/>
                            <rect x="130" y="190" width="30" height="60" rx="4" fill="#ECF0F1"/>
                            <rect x="170" y="190" width="30" height="60" rx="4" fill="#ECF0F1"/>

                            <!-- DAWソフトウェア画面 -->
                            <rect x="140" y="80" width="200" height="120" rx="8" fill="#34495E"/>
                            <rect x="150" y="90" width="180" height="20" rx="4" fill="#5C6BC0"/>
                            <rect x="150" y="120" width="180" height="70" rx="4" fill="#2C3E50"/>
                            <!-- 波形 -->
                            <path d="M160 155 L180 145 L200 165 L220 135 L240 155 L260 140 L280 160 L300 150 L320 155" stroke="#00BCD4" stroke-width="3"/>

                            <!-- ヘッドフォン -->
                            <ellipse cx="280" cy="140" rx="25" ry="30" fill="#5C6BC0"/>
                            <ellipse cx="340" cy="140" rx="25" ry="30" fill="#5C6BC0"/>
                            <path d="M280 110 Q310 90 340 110" stroke="#5C6BC0" stroke-width="8" fill="none"/>

                            <!-- 音符 -->
                            <circle cx="100" cy="60" r="8" fill="#FF6B9D"/>
                            <rect x="108" y="20" width="3" height="40" fill="#FF6B9D"/>
                            <circle cx="130" cy="50" r="8" fill="#FFC107"/>
                            <rect x="138" y="10" width="3" height="40" fill="#FFC107"/>

                            <!-- キャラクター（シンプル化） -->
                            <circle cx="320" cy="200" r="25" fill="#FFE0B2"/>
                            <circle cx="315" cy="195" r="3" fill="#333"/>
                            <circle cx="325" cy="195" r="3" fill="#333"/>
                            <path d="M315 205 Q320 210 325 205" stroke="#333" stroke-width="2" fill="none"/>
                            <ellipse cx="320" cy="250" rx="35" ry="45" fill="#FFB74D"/>
                        </svg>
                    </div>
                    <h2 class="studio-title">AI音楽アーティスト<br>制作スタジオ</h2>
                    <p class="studio-description">あなたのクリエイティビティを拡張する音楽制作</p>
                    <button class="studio-button">スタジオへ進む</button>
                </div>

                <!-- アプリ開発スタジオカード -->
                <div class="studio-card">
                    <div class="studio-illustration">
                        <!-- アプリ開発のイラストレーション -->
                        <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 背景グラデーション -->
                            <rect width="400" height="300" fill="#F5F5F5"/>

                            <!-- コンピューター画面 -->
                            <rect x="100" y="80" width="240" height="160" rx="8" fill="#2C3E50"/>
                            <rect x="110" y="90" width="220" height="130" rx="4" fill="#1E1E1E"/>

                            <!-- コード表示 -->
                            <rect x="120" y="100" width="80" height="8" rx="2" fill="#E06C75"/>
                            <rect x="120" y="115" width="120" height="8" rx="2" fill="#61AFEF"/>
                            <rect x="130" y="130" width="100" height="8" rx="2" fill="#98C379"/>
                            <rect x="120" y="145" width="140" height="8" rx="2" fill="#E5C07B"/>
                            <rect x="130" y="160" width="90" height="8" rx="2" fill="#C678DD"/>
                            <rect x="120" y="175" width="110" height="8" rx="2" fill="#56B6C2"/>
                            <rect x="130" y="190" width="80" height="8" rx="2" fill="#E06C75"/>

                            <!-- アイコン（設定、コード、チャット） -->
                            <circle cx="280" cy="110" r="20" fill="#5C6BC0"/>
                            <path d="M280 105 L280 115 M275 110 L285 110" stroke="white" stroke-width="2"/>

                            <rect x="260" y="145" width="40" height="30" rx="4" fill="#00BCD4"/>
                            <path d="M270 155 L275 160 L280 150" stroke="white" stroke-width="2" fill="none"/>
                            <path d="M285 165 L290 160 L295 165" stroke="white" stroke-width="2" fill="none"/>

                            <rect x="260" y="185" width="40" height="25" rx="4" fill="#FFC107"/>
                            <circle cx="270" cy="197" r="4" fill="white"/>
                            <circle cx="280" cy="197" r="4" fill="white"/>
                            <circle cx="290" cy="197" r="4" fill="white"/>

                            <!-- コンピューター台座 -->
                            <rect x="190" y="240" width="60" height="10" fill="#34495E"/>
                            <rect x="150" y="250" width="140" height="5" fill="#2C3E50"/>

                            <!-- キャラクター（シンプル化） -->
                            <circle cx="320" cy="200" r="25" fill="#FFE0B2"/>
                            <circle cx="315" cy="195" r="3" fill="#333"/>
                            <circle cx="325" cy="195" r="3" fill="#333"/>
                            <path d="M315 205 Q320 210 325 205" stroke="#333" stroke-width="2" fill="none"/>
                            <ellipse cx="320" cy="250" rx="35" ry="45" fill="#FFB74D"/>
                        </svg>
                    </div>
                    <h2 class="studio-title">アプリ開発<br>スタジオ</h2>
                    <p class="studio-description">次世代のアプリをAIで簡単に開発</p>
                    <button class="studio-button">スタジオへ進む</button>
                </div>
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">© 2022 MusiC. All rights reserved.</p>
            <div class="social-links">
                <a href="#" class="social-link">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </a>
                <a href="#" class="social-link">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                    </svg>
                </a>
                <a href="#" class="social-link">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
